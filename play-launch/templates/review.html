<title>Revisión de publicación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: one column per app; texts first, then images, videos, declarations and the setup; a sticky bar with progress and Approve. */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --surface-2: #eef2f0; --line: #d7dfdb;
  --fg: #17211d; --muted: #5b6b64; --accent: #0f7a5c; --accent-fg: #ffffff;
  --ok: #1b7f4a; --ok-bg: #e2f3e9; --warn: #9a6200; --warn-bg: #fdf1dc; --bad: #b3261e; --bad-bg: #fbe5e3;
  --display: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1d2824; --line: #2b3934;
  --fg: #e4ece8; --muted: #95a8a0; --accent: #3fc197; --accent-fg: #06261b;
  --ok: #5fd395; --ok-bg: #173325; --warn: #f0b552; --warn-bg: #362a12; --bad: #ff8a80; --bad-bg: #3a1a18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1d2824; --line: #2b3934;
  --fg: #e4ece8; --muted: #95a8a0; --accent: #3fc197; --accent-fg: #06261b;
  --ok: #5fd395; --ok-bg: #173325; --warn: #f0b552; --warn-bg: #362a12; --bad: #ff8a80; --bad-bg: #3a1a18; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 0 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-block: 12px; }
h1 { font: 700 20px/1.2 var(--display); margin: 0; letter-spacing: -0.01em; }
h2 { font: 600 22px/1.25 var(--display); margin: 0; text-wrap: balance; }
h3 { font: 600 13px/1.3 var(--body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.status-line { font-size: 13px; color: var(--muted); }
button { font: 600 14px var(--body); border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.toggle[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.app { display: grid; gap: 20px; margin-top: 28px; }
.app-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px var(--body); padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.bad { background: var(--bad-bg); color: var(--bad); }
.item.need { border-color: var(--warn); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.field { width: 100%; box-sizing: border-box; font: 15px var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.small { font-size: 12px; }
.notice.bad { border-left-color: var(--bad); background: var(--bad-bg); }
.notice { border-left: 3px solid var(--warn); background: var(--warn-bg); color: var(--fg); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; }
section.group { display: grid; gap: 12px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.item.reviewed { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.item-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.item-title { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.lang { font: 500 12px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
textarea { width: 100%; box-sizing: border-box; font: 15px/1.5 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
textarea.short { min-height: 44px; } textarea.long { min-height: 220px; }
.count { font: 500 12px var(--mono); color: var(--muted); }
.count.over { color: var(--bad); }
.edited { color: var(--warn); font-size: 12px; font-weight: 600; }
details.base summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.base div { white-space: pre-wrap; font-size: 14px; color: var(--muted); padding: 8px 0 0; }
.note { width: 100%; box-sizing: border-box; font: 14px var(--body); color: var(--fg); background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.shots.wide { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.shots img { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: block; }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
td.val { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
td.ev { color: var(--muted); font-size: 13px; word-break: break-word; }
a { color: var(--accent); }
pre { margin: 0; font: 13px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; background: var(--surface-2); padding: 12px; border-radius: 8px; }
.empty { margin-top: 40px; padding: 28px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; color: var(--muted); }
.approve-box { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
@media (prefers-reduced-motion: no-preference) { .item { transition: border-color .2s; } }
</style>

<header class="top"><div class="wrap">
  <div>
    <h1>Revisión de publicación</h1>
    <div class="status-line" id="status">Cargando lo generado…</div>
  </div>
  <div class="actions">
    <button id="approve-all" class="primary" disabled>Aprobar todas</button>
  </div>
</div></header>

<main class="wrap" id="root">
  <div class="empty" id="empty">
    <h2>Todavía no hay nada para revisar</h2>
    <p>Cuando Claude termine de generar los textos, las imágenes y las declaraciones de una app, aparecen aquí: primero los textos, que puedes corregir directamente, y al final el botón para aprobar.</p>
  </div>
</main>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};
const SECTION_ORDER = ["From you", "Store listing", "Release notes", "Declaration texts", "Images", "Videos", "Declarations", "Setup and tracks"];
const SECTION_ES = {"From you": "Lo que falta de ti", "Store listing": "Ficha de Play Store", "Release notes": "Notas de versión", "Declaration texts": "Textos de las declaraciones",
  "Images": "Imágenes", "Videos": "Videos", "Declarations": "Declaraciones", "Setup and tracks": "Configuración y pistas"};
const state = { items: new Map(), apps: new Map(), approvals: new Map(), db: null, userId: null, canWrite: true, drafts: new Map() };
const statusEl = $("#status");

function setStatus(text) { statusEl.textContent = text; }

async function write(id, patch) {
  if (!state.db || !state.canWrite) return;
  try { await state.db.collection("items").doc(id).update(patch); }
  catch (e) {
    if (e && e.code === "invalid_argument") { state.canWrite = false; setStatus("No tienes permiso para editar esta página: solo lectura."); }
    else setStatus("No se pudo guardar el último cambio. Vuelve a intentarlo en un momento.");
  }
}

const timers = new Map();
function saveDraft(id, value) {
  clearTimeout(timers.get(id));
  timers.set(id, setTimeout(() => write(id, { value, edited: true }), 700));
}

function appItems(appId) {
  return [...state.items.values()].filter(i => i.app === appId).sort((a, b) => (a.order || 0) - (b.order || 0));
}

function readiness(appId) {
  const items = appItems(appId);
  const texts = items.filter(i => i.kind === "text");
  const reviewed = texts.filter(i => i.reviewed).length;
  const over = texts.filter(i => i.limit && (state.drafts.get(i.id) ?? i.value ?? "").trim().length > i.limit).length;
  const open = items.filter(i => i.kind === "declaration" && !["derived", "answered"].includes(i.status)).length;
  const notes = items.filter(i => i.note).length;
  const pending = ((state.apps.get(appId) || {}).pending || []).length;
  const inputs = items.filter(i => i.kind === "input" && i.required);
  const missing = inputs.filter(i => !inputValid(i, state.drafts.get(i.id) ?? i.value ?? "")).length;
  return { texts: texts.length, reviewed, over, open, notes, pending, missing,
    ready: texts.length > 0 && reviewed === texts.length && !over && !open && !pending && !missing };
}

function inputValid(i, v) {
  v = (v || "").trim();
  if (!v) return false;
  if (i.type === "url") {
    if (!/^https:\/\/\S+$/.test(v)) return false;
    let host = "";
    try { host = new URL(v).hostname; } catch (_) { return false; }
    return !i.hosts || i.hosts.some(h => host === h || host.endsWith("." + h));
  }
  if (i.type === "email") return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
  return true;
}

function inputItem(i) {
  const value = state.drafts.get(i.id) ?? i.value ?? "";
  const status = h("span", { class: "chip" });
  const input = h("input", { class: "field", id: `in-${i.id}`, type: i.type === "email" ? "email" : "url", value,
    placeholder: i.placeholder || "", "aria-label": i.label, readonly: !state.canWrite,
    oninput: e => { state.drafts.set(i.id, e.target.value); refresh(); updateBar(); },
    onchange: e => write(i.id, { value: e.target.value.trim() }) });
  function refresh() {
    const v = input.value.trim();
    const ok = inputValid(i, v);
    status.className = "chip " + (ok ? "ok" : (v ? "bad" : "warn"));
    status.textContent = ok ? "Listo" : (v ? (i.type === "url" ? (i.hosts ? "Debe ser un enlace de " + i.hosts.join(" o ") : "Debe empezar con https://") : "Revisa el formato") : "Falta");
  }
  refresh();
  return h("div", { class: "item need" },
    h("div", { class: "item-head" }, h("div", { class: "item-title" }, i.label), status),
    h("ol", { class: "steps" }, (i.help || []).map(t => h("li", { text: t }))),
    input,
    h("div", { class: "muted small", text: "Se guarda solo al salir del campo. Claude lo aplica cuando le avises." }));
}

function textItem(i) {
  const value = state.drafts.get(i.id) ?? i.value ?? "";
  const long = (i.limit || 0) > 200 || value.length > 200;
  const count = h("span", { class: "count" });
  const edited = h("span", { class: "edited", text: "Editado" });
  const ta = h("textarea", { id: `ta-${i.id}`, class: long ? "long" : "short", rows: long ? 10 : 2, "aria-label": i.label,
    oninput: e => { state.drafts.set(i.id, e.target.value); refreshCount(); saveDraft(i.id, e.target.value); updateBar(); } });
  ta.value = value;
  if (!state.canWrite) ta.readOnly = true;
  function refreshCount() {
    const n = ta.value.trim().length;
    count.textContent = i.limit ? `${n} / ${i.limit}` : `${n}`;
    count.classList.toggle("over", !!i.limit && n > i.limit);
    edited.hidden = ta.value.trim() === (i.original || "").trim();
  }
  refreshCount();
  const reviewedBtn = h("button", { class: "toggle", "aria-pressed": i.reviewed ? "true" : "false", disabled: !state.canWrite,
    onclick: () => write(i.id, { reviewed: !i.reviewed }), text: i.reviewed ? "Revisado" : "Marcar revisado" });
  const note = h("input", { class: "note", id: `note-${i.id}`, placeholder: "Nota para Claude (opcional): qué cambiar y por qué", value: i.note || "",
    readonly: !state.canWrite, onchange: e => write(i.id, { note: e.target.value.trim() }) });
  return h("div", { class: "item" + (i.reviewed ? " reviewed" : ""), "data-id": i.id },
    h("div", { class: "item-head" },
      h("div", { class: "item-title" }, i.lang ? h("span", { class: "lang", text: i.lang }) : null, i.label),
      h("div", { class: "actions" }, edited, count, reviewedBtn)),
    ta,
    i.base ? h("details", { class: "base" }, h("summary", { text: "Ver el texto en el idioma base" }), h("div", { text: i.base })) : null,
    note);
}

function imagesItem(i) {
  const wide = ["featureGraphic", "tenInchScreenshots", "sevenInchScreenshots"].includes(i.label);
  return h("div", { class: "item" },
    h("div", { class: "item-title" }, h("span", { class: "lang", text: i.lang }), i.label, h("span", { class: "muted", text: `· ${i.files.length}` })),
    h("div", { class: "shots" + (wide ? " wide" : "") }, i.files.map(f => h("img", { src: f, alt: `${i.label} ${i.lang}`, loading: "lazy" }))),
    h("input", { class: "note", id: `note-${i.id}`, placeholder: "Nota para Claude (opcional)", value: i.note || "", readonly: !state.canWrite,
      onchange: e => write(i.id, { note: e.target.value.trim() }) }));
}

function declarationsTable(items) {
  return h("div", { class: "item" }, h("div", { class: "table" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", { text: "Pregunta" }), h("th", { text: "Respuesta" }), h("th", { text: "Evidencia y regla" }))),
    h("tbody", {}, items.map(i => {
      const ok = ["derived", "answered"].includes(i.status);
      return h("tr", {},
        h("td", {}, i.label, " ", h("span", { class: "chip " + (ok ? "ok" : "bad"), text: ok ? (i.status === "derived" ? "del build" : "respondida") : "falta" })),
        h("td", { class: "val", text: i.value }),
        h("td", { class: "ev" }, i.evidence || "—", i.rule ? h("div", {}, h("a", { href: i.rule, target: "_blank", rel: "noopener", text: "Regla de Google" })) : null));
    })))));
}

function renderApp(app) {
  const items = appItems(app.id);
  const r = readiness(app.id);
  const approval = state.approvals.get(app.id);
  const approved = approval && approval.approved;
  const bySection = new Map();
  for (const i of items) { if (!bySection.has(i.section)) bySection.set(i.section, []); bySection.get(i.section).push(i); }
  const groups = SECTION_ORDER.filter(s => bySection.has(s)).map(s => {
    const list = bySection.get(s);
    let body;
    if (s === "Declarations") body = declarationsTable(list);
    else if (s === "Images") body = list.map(imagesItem);
    else if (s === "Videos") body = list.map(i => h("div", { class: "item" }, h("div", { class: "item-title" }, i.label), h("a", { href: i.url, target: "_blank", rel: "noopener", text: i.url })));
    else if (s === "From you") body = list.map(inputItem);
    else if (s === "Setup and tracks") body = list.map(i => h("div", { class: "item" }, h("pre", { text: i.value })));
    else body = list.map(textItem);
    return h("section", { class: "group" }, h("h3", { text: SECTION_ES[s] || s }), body);
  });
  const reasons = [];
  if (r.reviewed < r.texts) reasons.push(`faltan ${r.texts - r.reviewed} textos por marcar revisados`);
  if (r.over) reasons.push(`${r.over} textos pasan su límite`);
  if (r.open) reasons.push(`${r.open} declaraciones sin respuesta`);
  if (r.missing) reasons.push(`completa ${r.missing === 1 ? "el campo" : r.missing + " campos"} de "Lo que falta de ti"`);
  if (r.pending) reasons.push(`${r.pending} pendientes de Claude (arriba, en rojo)`);
  const approveBtn = h("button", { class: approved ? "" : "primary", id: `approve-${app.id}`, disabled: !state.canWrite || (!approved && !r.ready),
    onclick: () => setApproval(app.id, !approved), text: approved ? "Quitar aprobación" : "Aprobar esta app" });
  return h("article", { class: "app", id: `app-${app.id}` },
    h("div", { class: "app-head" },
      h("div", {}, h("h2", { text: app.name }), h("div", { class: "muted mono", text: `${app.package} · ${(app.languages || []).join(", ")}` })),
      h("div", { class: "chips" },
        h("span", { class: "chip " + (r.reviewed === r.texts ? "ok" : ""), text: `Textos ${r.reviewed}/${r.texts}` }),
        r.notes ? h("span", { class: "chip warn", text: `${r.notes} notas` }) : null,
        h("span", { class: "chip " + (approved ? "ok" : "warn"), text: approved ? "Aprobada" : "Sin aprobar" }))),
    (app.pending || []).length ? h("div", { class: "notice bad" }, h("strong", { text: "Pendiente antes de aprobar (lo resuelve Claude, a veces con tu ayuda): " }), app.pending.join(" · ")) : null,
    (app.warnings || []).length ? h("div", { class: "notice" }, h("strong", { text: "Avisos de los controles: " }), app.warnings.join(" · ")) : null,
    groups,
    h("div", { class: "approve-box" },
      h("div", {}, h("strong", { text: approved ? "Aprobada. Claude cargará exactamente esto cuando inicies sesión." : "Aprobar esta app" }),
        h("div", { class: "muted", text: approved ? (approval.at ? `Aprobada el ${new Date(approval.at).toLocaleString()}` : "") :
          (reasons.length ? `Para aprobar: ${reasons.join(", ")}.` : (r.notes ? "Si dejas notas, Claude las aplica y te pide aprobar de nuevo." : "Todo revisado.")) })),
      approveBtn));
}

async function setApproval(appId, approved) {
  if (!state.db) return;
  try {
    await state.db.collection("approvals").doc(appId).set({ app: appId, approved, at: new Date().toISOString(), by: state.userId || null,
      hash: (state.apps.get(appId) || {}).hash || null });
  } catch (e) { setStatus("No se pudo guardar la aprobación. Vuelve a intentarlo."); }
}

function updateBar() {
  const apps = [...state.apps.values()];
  const ready = apps.filter(a => readiness(a.id).ready && !(state.approvals.get(a.id) || {}).approved);
  const all = $("#approve-all");
  all.disabled = !state.canWrite || ready.length === 0;
  all.textContent = ready.length > 1 ? `Aprobar ${ready.length} apps listas` : "Aprobar todas";
  all.onclick = async () => { for (const a of ready) await setApproval(a.id, true); };
}

function render() {
  const root = $("#root");
  const apps = [...state.apps.values()].sort((a, b) => a.name.localeCompare(b.name));
  const active = document.activeElement && document.activeElement.id;
  const caret = active && document.activeElement.selectionStart;
  root.replaceChildren(...(apps.length ? apps.map(renderApp) : [$("#empty") || h("div")]));
  if (!apps.length) root.append(h("div", { class: "empty" }, h("h2", { text: "Todavía no hay nada para revisar" }),
    h("p", { text: "Cuando Claude termine de generar una app, aparece aquí." })));
  if (active) { const el = document.getElementById(active); if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch (_) {} } }
  const approved = apps.filter(a => (state.approvals.get(a.id) || {}).approved).length;
  setStatus(apps.length ? `${apps.length} ${apps.length === 1 ? "app" : "apps"} · ${approved} aprobadas · los cambios se guardan solos` : "Sin apps para revisar");
  updateBar();
}

function listen(name, map, onFirst) {
  let first = true;
  state.db.collection(name).onSnapshot(snap => {
    map.clear();
    for (const d of snap.docs) map.set(d.id, { id: d.id, ...d.data() });
    if (first && !snap.metadata.fromCache) { first = false; onFirst && onFirst(); }
    // Keep a text being typed: only re-render when the change is not this viewer's own pending edit.
    if (!snap.metadata.hasPendingWrites || name !== "items") render();
  }, () => setStatus("Se perdió la conexión con los datos de la página. Recárgala más tarde."));
}

(async () => {
  const db = await claude.use("db");
  if (!db) { setStatus("Esta vista no puede leer los datos de la revisión. Ábrela con tu cuenta en claude.ai."); return; }
  state.db = db;
  const user = await claude.use("user");
  if (user) {
    try { state.userId = await user.id(); } catch (_) {}
    try { const can = await user.can("data.write"); if (can === false) state.canWrite = false; } catch (_) {}
  }
  const timer = setTimeout(() => setStatus("Los datos todavía no llegan. Revisa tu conexión."), 10000);
  listen("apps", state.apps, () => clearTimeout(timer));
  listen("items", state.items);
  listen("approvals", state.approvals);
})();
</script>
