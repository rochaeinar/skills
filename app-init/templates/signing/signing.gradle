// Release signing for {{APP_NAME}}, without any password on disk. See SIGNING.md.
// Generated by the app-init skill. Applied at the end of app/build.gradle(.kts):
//   Groovy: apply from: rootProject.file('gradle/signing.gradle')
//   Kotlin: apply(from = rootProject.file("gradle/signing.gradle"))
//
// Where each value comes from (gradle.properties holds only names, never secrets):
//   keystore  <PREFIX>_STORE_FILE, or appDataDir + signing.keystore (the app folder, outside the repo)
//   alias     <PREFIX>_KEY_ALIAS, or the user name of the credential
//   passwords <PREFIX>_STORE_PASSWORD / <PREFIX>_KEY_PASSWORD (CI, manual builds), or the Windows
//             Credential Manager entries signing.credential and signing.credential + "-key"
// With credentials, release (and debug when signing.signDebug=true, so Google sign-in and the
// Play-installed app accept a debug install) are signed with the upload key. Without them,
// release stays unsigned (the build warns) and debug uses the default Android debug key.

def prop = { String key, String fallback = null ->
    def v = project.findProperty(key)
    v != null ? v.toString().trim() : fallback
}
def prefix = prop('signing.envPrefix', 'APP')
def credentialTarget = prop('signing.credential')
def appDataDir = System.getenv("${prefix}_APP_DIR") ?: prop('appDataDir')
def signDebug = prop('signing.signDebug', 'true').toBoolean()

def readCredential = { String target ->
    try {
        def script = 'try { Import-Module CredentialManager -ErrorAction Stop; ' +
                '$c = Get-StoredCredential -Target \'' + target + '\'; ' +
                'if ($c) { $c.UserName; $c.GetNetworkCredential().Password } } catch {}'
        def proc = ['powershell', '-NoProfile', '-NonInteractive', '-Command', script].execute()
        proc.waitFor()
        def lines = proc.text.readLines().collect { it.trim() }.findAll { it }
        return lines.size() >= 2 ? [user: lines[0], pwd: lines[1]] : null
    } catch (ignored) {
        return null
    }
}

def resolveSigning = {
    def storeFile = System.getenv("${prefix}_STORE_FILE")
    def alias = System.getenv("${prefix}_KEY_ALIAS")
    def storePwd = System.getenv("${prefix}_STORE_PASSWORD")
    def keyPwd = System.getenv("${prefix}_KEY_PASSWORD")
    def onWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    if (storePwd == null && onWindows && credentialTarget) {
        def c = readCredential(credentialTarget)
        if (c != null) {
            alias = alias ?: c.user
            storePwd = c.pwd
            def k = readCredential(credentialTarget + '-key')
            keyPwd = keyPwd ?: (k != null ? k.pwd : c.pwd)
        }
    }
    if (storeFile == null && appDataDir) {
        storeFile = new File(appDataDir, prop('signing.keystore', 'KeyStore/upload.jks')).path
    }
    if (keyPwd == null) keyPwd = storePwd
    if (storeFile != null && new File(storeFile).exists() && storePwd != null && alias != null) {
        return [file: storeFile, alias: alias, storePwd: storePwd, keyPwd: keyPwd]
    }
    return null
}

def taskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def anyBuildTask = taskNames.any { it.contains('assemble') || it.contains('bundle') || it.contains('install') ||
        it.contains('release') || it.contains('debug') || it.contains('build') }
def wantsRelease = taskNames.any { it.contains('release') || it.contains('bundle') }
// Android Studio's sync runs no build task: no PowerShell call then.
def creds = anyBuildTask ? resolveSigning() : null
if (wantsRelease && creds == null) {
    println "WARNING: release build requested but no signing credentials found (env ${prefix}_STORE_PASSWORD " +
            "or Windows Credential Manager '${credentialTarget}', keystore under ${appDataDir}). " +
            "Run setup-signing.ps1 -Register (SIGNING.md). The release artifact will be UNSIGNED."
}

if (creds != null) {
    android {
        signingConfigs {
            upload {
                storeFile file(creds.file)
                storePassword creds.storePwd
                keyAlias creds.alias
                keyPassword creds.keyPwd
            }
        }
        buildTypes {
            release { signingConfig signingConfigs.upload }
            if (signDebug) {
                debug { signingConfig signingConfigs.upload }
            }
        }
    }
}
