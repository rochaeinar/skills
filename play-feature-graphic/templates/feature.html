<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?$font_query&display=block" rel="stylesheet">
<style>
  :root {
    --bg: $c_bg;
    --accent: $c_accent;
    --accent-soft: $c_accent_soft;
    --deep: $c_deep;
    --text: $c_text;
    --muted: $c_muted;
    --on-accent: $c_on_accent;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; background: var(--bg); }
  .canvas {
    position: relative; width: 1024px; height: 500px; overflow: hidden;
    background:
      radial-gradient(circle at 76% 55%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 46%),
      radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--deep) 35%, transparent), transparent 50%),
      var(--bg);
    font-family: '$font_body', 'Segoe UI', sans-serif;
  }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 430px;
          display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 92px; margin-bottom: 18px; margin-left: -6px; }
  h1 { font-family: '$font_title', Georgia, serif; font-weight: $font_title_weight;
       font-size: ${title_size}px; line-height: 0.95; color: var(--text); letter-spacing: 0.5px; }
  .tagline { margin-top: 16px; font-size: 19px; line-height: 1.4; color: var(--muted); }
  .tagline b { color: var(--accent-soft); font-weight: 500; }
  .chips { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font-size: 14px; font-weight: 500; color: var(--text); padding: 8px 14px;
          border-radius: 999px; background: rgba(255,255,255,0.06);
          border: 1px solid color-mix(in srgb, var(--accent-soft) 28%, transparent); white-space: nowrap; }
  .chip.hero { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }

  .phone { position: absolute; border-radius: 30px; padding: 7px; background: #050708;
           box-shadow: 0 0 0 1.5px #2b3437, 0 30px 60px rgba(0,0,0,0.55); }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 23px; }
  .p-center { width: ${center_w}px; height: ${center_h}px; left: 640px; top: 40px; z-index: 3; }
  .p-left   { width: ${side_w}px; height: ${side_h}px; left: 516px; top: 74px; z-index: 2;
              transform: rotate(-7deg); opacity: 0.92; }
  .p-right  { width: ${side_w}px; height: ${side_h}px; left: 792px; top: 74px; z-index: 1;
              transform: rotate(7deg); opacity: 0.92; }
</style>
</head>
<body>
<div class="canvas">
  <div class="copy">
    <img class="logo" src="logo.png" alt="">
    <h1>$title_html</h1>
    <p class="tagline">$tagline_html</p>
    <div class="chips">
      $chips_html
    </div>
  </div>
  <div class="phone p-left"><img src="left.jpg" alt=""></div>
  <div class="phone p-right"><img src="right.jpg" alt=""></div>
  <div class="phone p-center"><img src="center.jpg" alt=""></div>
</div>
</body>
</html>
